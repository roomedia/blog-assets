var DOC = {"documentId": "", "document": {"version": "2.10.2", "theme": "default", "language": "ko-KR", "id": "015833B94F31DE4B15B97BBACF", "components": [{"id": "SE-69d3e821-620c-41ba-ae30-3bf9214f6888", "layout": "default", "title": [{"id": "SE-4368d57f-ac5d-4d0e-ad02-3b8cd25854c0", "nodes": [{"id": "SE-9bc3abce-a894-4a08-af3c-4976925de2b7", "value": "코딩 에이전트 토큰 5배 줄이는 프록시", "@ctype": "textNode"}], "@ctype": "paragraph"}], "subTitle": null, "align": "left", "@ctype": "documentTitle"}, {"id": "SE-8afb177e-f40b-45a6-b637-9dc12c3627dc", "layout": "default", "value": [{"id": "SE-07cb0df1-2623-473d-af28-c931e80c85e6", "nodes": [{"id": "SE-5a75008f-32e6-4b66-9782-3cc0c1b05998", "value": "코딩 에이전트를 오래 쓰다 보면 컨텍스트가 차버려 세션이 멈추는 일을 자주 겪는다. 이 문제를 에이전트 밖 프록시 레이어에서 해결하려는 오픈소스 프로젝트가 GitHub 주간 트렌딩에 올랐다.", "@ctype": "textNode"}], "@ctype": "paragraph"}], "@ctype": "text"}, {"id": "SE-53236b1c-9ce0-4f52-b108-543331a17981", "layout": "default", "value": [{"id": "SE-3093f57f-c57e-4f82-9d8a-675d13743971", "nodes": [{"id": "SE-903ba2e1-c559-490a-9580-b183debbcbd0", "value": "주인공은 ranxianglei가 만든 billion-context다. 2026년 8월 6일 공개된 컨텍스트 압축 플러그인으로, 10월 11일 기준 스타 776개를 받았고 최근까지 활발히 업데이트되고 있다.", "@ctype": "textNode"}], "@ctype": "paragraph"}], "@ctype": "text"}, {"id": "SE-cb15de5e-d877-4437-bf3f-4d931f3b6a47", "layout": "default", "value": [{"id": "SE-514e5574-f3cd-4c15-b995-e0cb433ee9c7", "nodes": [{"id": "SE-8d9c984f-c7a2-48c5-8b64-149adc1b0109", "value": "동작 방식은 단순하다. 에이전트와 모델 API 사이에 프록시로 끼어드는 것이다. 에이전트의 base URL만 프록시 주소로 바꾸면, 요청을 파싱하고 대화 내용을 압축한 뒤 실제 모델 API로 전달한다. 응답은 스트리밍으로 다시 써서 돌려준다.", "@ctype": "textNode"}], "@ctype": "paragraph"}], "@ctype": "text"}, {"id": "SE-59635e1a-34b3-4c61-9f47-d9f43ea0955a", "layout": "default", "value": [{"id": "SE-6de858e7-6b2e-4a32-9248-c8dbfef200b3", "nodes": [{"id": "SE-619e1d28-887e-4bae-a972-957752d709ae", "value": "핵심은 압축 타이밍과 범위를 모델이 직접 정한다는 점이다. 프록시가 대화 안에 네 가지 컨텍스트 관리 도구를 주입하고, 모델은 컨텍스트가 찰 때 스스로 메시지 구간을 요약으로 접는다. 필요하면 다시 펼칠 수도 있다.", "@ctype": "textNode"}], "@ctype": "paragraph"}], "@ctype": "text"}, {"id": "SE-739f6258-394e-4222-b807-5813260714dc", "layout": "default", "value": [{"id": "SE-c424d441-324c-47fd-bd89-c2ac67942f28", "nodes": [{"id": "SE-5307b9de-a5a9-4429-a311-ee6f7a67b621", "value": "기존 호스트 내장 요약 기능과 달리 증분 압축과 가역 압축을 내세운다. 작은 범위로만 요약 기록을 남기고 언제든 복원이 가능하며, 프리픽스 캐시가 깨지지 않는 구조라고 설명한다. 건강한 세션에서는 캐시 히트율 95퍼센트에서 97퍼센트 수준이라고 주장한다.", "@ctype": "textNode"}], "@ctype": "paragraph"}], "@ctype": "text"}, {"id": "SE-8b4d4ca7-b8a2-48b1-8c52-ed36e50b4335", "layout": "default", "value": [{"id": "SE-069bea6e-b240-42c2-b50c-19e55f2812e6", "nodes": [{"id": "SE-491e00c3-3ea7-47e0-a525-76eef474dffc", "value": "개발자가 내세우는 수치는 꽤 공격적이다. 100K 컨텍스트로 충분하고 토큰을 5배 절감하며, 수십억 토큰을 단일 세션으로 수개월 유지할 수 있다는 것이다. 근거로는 4개월 반에 걸친 종단 연구를 제시한다. 세 개 호스트에서 17만 회가 넘는 모델 호출, 누적 입력 토큰 187억, 20만 토큰 모델에서 윈도우 위반 0건을 기록했다고 한다.", "@ctype": "textNode"}], "@ctype": "paragraph"}], "@ctype": "text"}, {"id": "SE-c11de53e-73c5-41b2-997e-915f0ba2ad27", "layout": "default", "value": [{"id": "SE-ba0ceba6-ee9c-4f98-a0b6-fc483e9210c5", "nodes": [{"id": "SE-1b1a849c-2a0e-4399-8068-bb2883c0f6ab", "value": "다만 이 수치들은 개발자 본인이 측정한 자가 측정치이며 독립 검증이 없다는 점은 분명히 밝혀둬야 한다. 동봉된 페이퍼도 계속 바뀌는 living document라 주장 자체가 유동적일 수 있다.", "@ctype": "textNode"}], "@ctype": "paragraph"}], "@ctype": "text"}, {"id": "SE-5effa719-4c06-4e32-9101-5f01dc283b82", "layout": "default", "value": [{"id": "SE-6c39e7d9-562c-45f6-92dd-805d1fbf9df9", "nodes": [{"id": "SE-27ac3ca8-83dc-4391-9ad0-9cfe756b32ef", "value": "지원하는 클라이언트도 넓다. Claude Code와 Codex, Cursor, Aider, OpenCode, Gemini CLI, Qwen Code 등 스무 종이 넘는다. npm 패키지 하나로 글로벌 설치가 가능하고, 클라이언트별 설치 경로가 CLIENTS.md에 정리되어 있다.", "@ctype": "textNode"}], "@ctype": "paragraph"}], "@ctype": "text"}, {"id": "SE-7f2bbc6a-78c3-4f8f-a93d-e1d703afbce4", "layout": "default", "value": [{"id": "SE-c9623393-3203-40d1-a240-544bbd91fb49", "nodes": [{"id": "SE-7e2e6c88-a1a3-4318-9809-933196ccd77a", "value": "라이선스는 TypeScript 코드베이스이며, 핵심 압축 커널은 acp-kernel이라는 별도 레포로 분리되어 있다. 소스와 페이퍼는 GitHub에서 직접 확인할 수 있다.", "@ctype": "textNode"}], "@ctype": "paragraph"}], "@ctype": "text"}, {"id": "SE-b45b3ee8-952f-4e2c-93d2-f23194e4f478", "layout": "default", "value": [{"id": "SE-167131a7-079f-4cc1-9a17-98fd8e2c96b7", "nodes": [{"id": "SE-27dc2171-95f1-4606-a5a4-4c1368529cba", "value": "유의할 점도 있다. 일부 클라이언트는 cert-MITM 방식으로 트래픽을 가로채므로, 기업 환경에서 도입할 때는 보안 검토가 필요하다. 압축이 요약 위주라 세부 구현 디테일이 손실될 가능성도 아직 외부 평가가 없다.", "@ctype": "textNode"}], "@ctype": "paragraph"}], "@ctype": "text"}, {"id": "SE-294aa0b1-0f6f-4bce-b0c2-5da1d9cf4efd", "layout": "default", "value": [{"id": "SE-7055831e-0962-47af-987f-c3940c6b0dda", "nodes": [{"id": "SE-7b047a21-8b60-48d2-8c2f-ea78af6f4432", "value": "그럼에도 대형 레포를 오래 붙잡고 리팩토링하는 작업에서는 컨텍스트 폭발이 곧 비용과 품질 병목이다. 같은 주간에 트렌딩에 함께 오른 mksglu의 context-mode와 문제의식은 같다. 컨텍스트 관리는 에이전트 하네스의 핵심 레이어로 굳어지는 흐름이다.", "@ctype": "textNode"}], "@ctype": "paragraph"}], "@ctype": "text"}, {"id": "SE-ea55f78f-d9be-4c0b-85f0-b50d6a55c948", "layout": "default", "value": [{"id": "SE-dc52a2dc-ebc3-446b-96d7-89892ba172a5", "nodes": [{"id": "SE-aac158f5-22f0-4437-a6d9-108d1486dd1e", "value": "더 자세한 내용과 설치 방법은 billion-context GitHub 레포에서 확인할 수 있다. 주소는 https://github.com/ranxianglei/billion-context 이다.", "@ctype": "textNode"}], "@ctype": "paragraph"}], "@ctype": "text"}], "di": {"dif": false, "dio": [{"dis": "N", "dia": {"t": 0, "p": 0, "st": 35, "sk": 5}}, {"dis": "N", "dia": {"t": 0, "p": 0, "st": 35, "sk": 5}}, {"dis": "N", "dia": {"t": 0, "p": 0, "st": 35, "sk": 5}}, {"dis": "N", "dia": {"t": 0, "p": 0, "st": 35, "sk": 5}}, {"dis": "N", "dia": {"t": 0, "p": 0, "st": 35, "sk": 5}}, {"dis": "N", "dia": {"t": 0, "p": 0, "st": 35, "sk": 5}}, {"dis": "N", "dia": {"t": 0, "p": 0, "st": 35, "sk": 5}}, {"dis": "N", "dia": {"t": 0, "p": 0, "st": 35, "sk": 5}}, {"dis": "N", "dia": {"t": 0, "p": 0, "st": 35, "sk": 5}}, {"dis": "N", "dia": {"t": 0, "p": 0, "st": 35, "sk": 5}}, {"dis": "N", "dia": {"t": 0, "p": 0, "st": 35, "sk": 5}}, {"dis": "N", "dia": {"t": 0, "p": 0, "
